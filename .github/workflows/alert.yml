name: Trend alert

on:
  schedule:
    - cron: "*/30 * * * *" # every 30 minutes (GitHub may delay a few minutes at busy times)
  workflow_dispatch: {} # lets you run it by hand from the Actions tab

permissions:
  contents: write # to save seen.json, so the same trend never alerts twice

concurrency:
  group: trend-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Google Trends and alert
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python trend_alert.py
      - name: Save what was already sent
        run: |
          if [ -n "$(git status --porcelain seen.json)" ]; then
            git config user.name "trend-alert"
            git config user.email "trend-alert@users.noreply.github.com"
            git add seen.json
            git commit -m "Update seen trends"
            git push
          fi
